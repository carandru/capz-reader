<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070a"><link rel="stylesheet" href="/static/style.css"><title>Reader</title></head>
<body class="reader-body">
<header class="reader-top"><a href="/" class="back">‹ Library</a><div id="readerTitle" class="reader-title"></div><div class="reader-actions"><button id="modeBtn">Single</button><button id="rtlBtn">RTL</button><a id="downloadBtn" class="button-link" download>Download</a></div></header>
<div id="reader" class="reader single"></div>

<script src="/static/reader.js"></script></body></html>
