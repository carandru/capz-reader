<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <link rel="stylesheet" href="/static/style.css">
  <title>Reader</title>
</head>
<body class="reader-body">
<header class="reader-top reader-control">
  <a href="/" class="back">‹ Library</a>
  <div id="readerTitle" class="reader-title"></div>
  <div class="reader-toolbar">
    <div class="reader-segment" id="modeSegment">
      <button data-mode="single">Single</button>
      <button data-mode="double">Double</button>
      <button data-mode="vertical">Vertical</button>
    </div>
    <div class="reader-segment" id="fitSegment">
      <button data-fit="page">Fit page</button>
      <button data-fit="width">Fit width</button>
    </div>
    <div class="reader-segment" id="dirSegment">
      <button data-dir="ltr">LTR</button>
      <button data-dir="rtl">RTL</button>
    </div>
    <button id="readerMoreBtn" class="reader-more">•••</button>
  </div>
</header>

<div id="readerMoreMenu" class="reader-more-menu hidden reader-control">
  <a id="downloadBtn" class="button-link" download>Download PDF</a>
</div>

<div id="loadingPage" class="reader-loading"><span class="spinner"></span><span>Loading page…</span></div>
<div id="reader" class="reader single fit-page"></div>

<div class="reader-bottom reader-control">
  <button id="prevBtn" aria-label="Previous">‹</button>
  <div><span id="pageText">1 / 1</span><input id="pageSlider" type="range" min="1" max="1" value="1"></div>
  <button id="nextBtn" aria-label="Next">›</button>
</div>
<div id="readerToast" class="toast hidden"></div>
<script src="/static/reader.js"></script>
</body>
</html>
