services:
  reader:
    build: .
    container_name: nas-reader
    restart: unless-stopped
    ports:
      - "${PORT:-8020}:8000"
    environment:
      APP_NAME: "${APP_NAME:-NAS PDF Reader}"
      LIBRARY_ROOT: /library
      DATA_DIR: /data
      CACHE_DIR: /cache
      AUTO_SCAN_ON_START: "${AUTO_SCAN_ON_START:-true}"
      ALLOW_DELETE_FILES: "${ALLOW_DELETE_FILES:-false}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      MISSING_RETENTION_DAYS: "${MISSING_RETENTION_DAYS:-14}"
      THUMB_WIDTH: "${THUMB_WIDTH:-320}"
      PREVIEW_WIDTH: "${PREVIEW_WIDTH:-760}"
      READER_WIDTH: "${READER_WIDTH:-1800}"
      RENDER_CACHE_DAYS: "${RENDER_CACHE_DAYS:-30}"
      RENDER_CACHE_LIMIT_GB: "${RENDER_CACHE_LIMIT_GB:-8}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - "${LIBRARY_PATH:-./library}:/library:${LIBRARY_ACCESS:-ro}"
      - ./data:/data
      - ./cache:/cache
